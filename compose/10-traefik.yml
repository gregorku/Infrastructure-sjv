###############################################################################
#
# Traefik. Ports 80 and 443 are the container listeners for a later HAProxy
# path and for local tests. They are not a public DNAT.
# No Docker provider and no access to the Docker socket.
# The admin entrypoint is not published by this file.
#
###############################################################################

services:
  traefik:
    image: ${TRAEFIK_IMAGE:?TRAEFIK_IMAGE}
    container_name: sjv-traefik
    hostname: sjv-traefik
    restart: unless-stopped
    init: true
    # The image has no unprivileged account. Dropping privileges would make
    # the root-owned ACME, log and plugin directories unwritable. The process
    # keeps only the capability required to bind ports 80 and 443.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    command:
      - --configFile=/etc/traefik/traefik.yml
    networks:
      sjv-proxy:
        ipv4_address: ${TRAEFIK_PROXY_ADDRESS:?TRAEFIK_PROXY_ADDRESS}
      sjv-internal: {}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../runtime/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../runtime/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${DATA_DIR}/traefik/users:/etc/traefik/users:ro
      - ${DATA_DIR}/traefik/acme:/etc/traefik/acme
      - ${DATA_DIR}/traefik/logs:/var/log/traefik
      - ${DATA_DIR}/traefik/plugins:/plugins-storage
      - ${DATA_DIR}/traefik/crowdsec:/etc/traefik/crowdsec:ro
    depends_on:
      crowdsec:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:?LOG_MAX_SIZE}
        max-file: ${LOG_MAX_FILES:?LOG_MAX_FILES}
