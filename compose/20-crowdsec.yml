###############################################################################
#
# CrowdSec reads only this stack's Traefik access log.
# LAPI stays on sjv-internal. No host port is published.
# sjv-egress is how the container reaches the CrowdSec hub.
#
###############################################################################

services:
  crowdsec:
    image: ${CROWDSEC_IMAGE:?CROWDSEC_IMAGE}
    container_name: sjv-crowdsec
    hostname: sjv-crowdsec
    restart: unless-stopped
    init: true
    # The image entrypoint runs as root: it writes /etc/crowdsec, registers
    # the local agent and refuses to start unless the data directory is a
    # mounted volume. A non-root user or a read-only root filesystem would
    # stop that before LAPI listens. Capabilities are dropped because this
    # container does not install firewall rules or bind a privileged port.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:?TZ}
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/traefik"
    volumes:
      - ../configs/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ../configs/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ${DATA_DIR}/crowdsec/data:/var/lib/crowdsec/data
      - ${DATA_DIR}/traefik/logs:/logs:ro
    networks:
      - sjv-internal
      - sjv-egress
    healthcheck:
      # cscli lapi status authenticates to the URL in the image credentials,
      # which is http://0.0.0.0:8080. A closed port or a refused login fails
      # the command. Docker stops the check after the timeout if it hangs.
      test: ["CMD-SHELL", "cscli lapi status >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:?LOG_MAX_SIZE}
        max-file: ${LOG_MAX_FILES:?LOG_MAX_FILES}
