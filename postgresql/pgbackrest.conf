# Local repository only. No cipher, no remote and no secrets in this file.
# expire-auto stays off: backup.sh runs expire after the remote snapshot.
# The catalog number inside pgBackRest 2.60.1 differs from PostgreSQL 19.0.
# An isolated test backed up and restored a cluster that used this file.
# This image does not run stanza-create, backup or restore by itself.

[global]
repo1-path=/backup/pgbackrest
repo1-retention-full=2
repo1-bundle=n
archive-async=y
spool-path=/var/lib/postgresql/spool
expire-auto=n
start-fast=y
log-level-console=info
log-level-file=off

[sjv]
pg1-path=/var/lib/postgresql/19/docker
pg1-port=5432
pg1-user=pgbackrest
pg1-database=sjv
